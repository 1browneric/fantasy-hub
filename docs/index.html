<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fantasy Hub</title>
<meta name="theme-color" content="#07160F">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy Hub">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="wordmark">Fantasy <b>Hub</b></div>
    <div class="wk"><span id="wk"></span><span id="live" class="live" hidden></span><span id="upd" class="upd">Loading</span></div>
  </div>
  <nav class="rail" id="rail" role="tablist"></nav>
</header>
<main id="view"><div class="empty">Loading</div></main>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', async () => {
  // Always check for a new worker, and reload once when a new one takes over
  // so a deploy is never a load behind.
  try {
    const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
    reg.update().catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
  } catch (e) { console.warn(e); }
});
</script>
</body>
</html>
