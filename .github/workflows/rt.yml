name: RT Sports guest data

# Public guest pages only: no login, no secrets. Every 5 minutes inside NFL
# game windows (Central Time expressed in UTC), hourly the rest of the week.
on:
  schedule:
    - cron: '*/5 17-23 * 9-12,1 0'     # Sun 12:00-6:59pm CT  (17:00-23:59 UTC)
    - cron: '*/5 0-5 * 9-12,1 1'       # Sun night 7:00pm-12:59am CT (Mon 00-05 UTC)
    - cron: '*/5 0-5 * 9-12,1 2'       # Mon night 7:00pm-12:59am CT (Tue 00-05 UTC)
    - cron: '*/5 0-5 * 9-12,1 5'       # Thu night 7:00pm-12:59am CT (Fri 00-05 UTC)
    - cron: '17 * * * *'               # hourly, all week
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rt-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and parse RT guest pages
        run: node build/rt-fetch.mjs
      - name: Weekly projections, pre-scored
        run: node build/build-proj.mjs
      - name: Commit if changed
        run: |
          git config user.name "rt-data-bot"
          git config user.email "rt-data-bot@users.noreply.github.com"
          git add docs/data/rt/*.json docs/data/proj.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "rt: guest data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
