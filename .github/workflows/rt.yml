name: RT Sports guest data

# Public guest pages only: no login, no secrets.
#
# FIVE PULLS A WEEK (Eric, 2026-10-29), not an always-on loop. Until then each
# run lived 340 minutes and dispatched its own successor, so a runner was busy
# around the clock (~45,000 minutes in October; free only because this repo is
# public). Live NFL scoring comes from ESPN straight to the phone, so RT is
# only needed at these points:
#   Thursday  5:00 PM CT  before Thursday Night Football
#   Saturday  8:00 AM CT
#   Sunday    9:30 AM CT  before the noon kickoffs
#   Sunday    3:00 PM CT
#   Monday    8:00 AM CT
# GitHub cron is UTC and has no time zone: these are Central STANDARD time
# (UTC-6), the whole season after the first Sunday in November. In September
# and October (daylight time) each lands an hour later on the clock.
# GitHub's scheduler drops and delays runs, so every slot has a retry 40
# minutes later; build/rt-pull.sh skips it when the first one already landed.
on:
  schedule:
    - cron: '0 23 * * 4'      # Thu 5:00 PM CT
    - cron: '40 23 * * 4'     #   retry
    - cron: '0 14 * * 6'      # Sat 8:00 AM CT
    - cron: '40 14 * * 6'     #   retry
    - cron: '30 15 * * 0'     # Sun 9:30 AM CT
    - cron: '10 16 * * 0'     #   retry
    - cron: '0 21 * * 0'      # Sun 3:00 PM CT
    - cron: '40 21 * * 0'     #   retry
    - cron: '0 14 * * 1'      # Mon 8:00 AM CT
    - cron: '40 14 * * 1'     #   retry
  workflow_dispatch:          # a manual pull from the Actions tab, any time

permissions:
  contents: write

concurrency:
  group: rt-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull RT once
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          git config user.name "rt-data-bot"
          git config user.email "rt-data-bot@users.noreply.github.com"
          bash build/rt-pull.sh
